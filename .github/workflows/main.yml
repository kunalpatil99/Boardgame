name: Java CI with Maven

on:
  push:
    branches:
      - main

env:
  APP_NAME: devopsshack-java-demo

jobs:

  pre-build:
    name: Pre Build
    runs-on: ubuntu-latest

    env:
      STAGE_NAME: before_package

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Tests
        run: |
          mvn test
          echo "App Name: $APP_NAME"
          echo "Stage Name: $STAGE_NAME"

  build:
    name: Build
    runs-on: ubuntu-latest

    needs: pre-build

    env:
      STAGE_NAME: package
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: nexus
          server-username: NEXUS_USERNAME
          server-password: NEXUS_PASSWORD

      - name: Build and Deploy
        run: |
          mvn deploy
          echo "App Name: $APP_NAME"
          echo "Stage Name: $STAGE_NAME"
